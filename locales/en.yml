  preset_no_news_blurb: "Cuts the doom-scroll loop: BBC, CNN, NYT, Lenta, RBC, Meduza and friends."
  preset_no_games_label: "No Games"
  preset_no_games_blurb: "Steam, Epic, Battle.net, console stores, browser games and gaming media."
  preset_no_chat_label: "No Chat"
  preset_no_chat_blurb: "Slack, Discord, Telegram, WhatsApp, Teams, Messenger. Useful for short writing sprints."
  preset_no_shopping_label: "No Shopping"
  preset_no_shopping_blurb: "Anti-impulse-buy: Amazon, eBay, AliExpress, Wildberries, Ozon, Avito, Temu and others."
  preset_no_adult_label: "No Adult"
  preset_no_adult_blurb: "Adult content. Long min-duration and cooldown so it actually sticks."
  preset_no_gambling_label: "No Gambling"
  preset_no_gambling_blurb: "Betting, crypto exchanges and finance-doom feeds — one addiction loop."
  preset_no_dating_label: "No Dating"
  preset_no_dating_blurb: "Tinder, Bumble, Hinge, Mamba and rest. Useful when you decided to stop swiping."
  preset_no_ai_label: "No AI"
  preset_no_ai_blurb: "ChatGPT, Claude, Gemini, Cursor, all AI tools. Forces you to think first."
