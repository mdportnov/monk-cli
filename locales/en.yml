  preset_deepwork_label: "Deep Work"
  preset_deepwork_blurb: "Work-session focus: social, video, news and tech-news traps are blocked. Chat stays open for Slack."
  preset_morning_label: "Morning Routine"
  preset_morning_blurb: "Auto-starts daily 06:00–09:00 (your laptop's timezone): social, video, news, chat and time-sink reads stay off until the morning is yours."
  preset_study_label: "Study"
  preset_study_blurb: "Student mode: social, video, games, chat, AI tools and dev-news traps off. Forces original thinking."
  preset_detox_label: "Digital Detox"
  preset_detox_blurb: "Long content cleanse: social, video, news, shopping and time-sink reads. Chat allowed for family."
  preset_sleep_label: "Sleep Mode"
  preset_sleep_blurb: "Evening wind-down: social, video, news and games. Auto-starts daily 22:30–07:00 in your local timezone."
  preset_sober_label: "Sober"
  preset_sober_blurb: "Recovery: adult, betting, crypto, dating, finance doom. Long min-duration so it stays on."
  preset_lockdown_label: "Lockdown"
  preset_lockdown_blurb: "Almost everything off except chat. Emergency deadline mode with friction on escape."
  preset_no_social_label: "No Social"
  preset_no_social_blurb: "FB, IG, X, TikTok, Reddit, Threads, VK, OK and the rest. Just social — nothing else."
  preset_no_video_label: "No Video"
  preset_no_video_blurb: "Anti-binge: YouTube, Netflix, Twitch, Disney+, streaming. RU streamings too."
  preset_no_news_label: "No News"
  preset_no_news_blurb: "Cuts the doom-scroll loop: BBC, CNN, NYT, Lenta, RBC, Meduza and friends."
  preset_no_games_label: "No Games"
  preset_no_games_blurb: "Steam, Epic, Battle.net, console stores, browser games and gaming media."
  preset_no_chat_label: "No Chat"
  preset_no_chat_blurb: "Slack, Discord, Telegram, WhatsApp, Teams, Messenger. Useful for short writing sprints."
  preset_no_shopping_label: "No Shopping"
  preset_no_shopping_blurb: "Anti-impulse-buy: Amazon, eBay, AliExpress, Wildberries, Ozon, Avito, Temu and others."
  preset_no_adult_label: "No Adult"
  preset_no_adult_blurb: "Adult content. Long min-duration and cooldown so it actually sticks."
  preset_no_gambling_label: "No Gambling"
  preset_no_gambling_blurb: "Betting, crypto exchanges and finance-doom feeds — one addiction loop."
  preset_no_dating_label: "No Dating"
  preset_no_dating_blurb: "Tinder, Bumble, Hinge, Mamba and rest. Useful when you decided to stop swiping."
  preset_no_ai_label: "No AI"
  preset_no_ai_blurb: "ChatGPT, Claude, Gemini, Cursor, all AI tools. Forces you to think first."
