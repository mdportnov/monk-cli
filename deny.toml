[graph]
all-features = true
# Only the triples we actually ship (see release.yml).
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2025-0119",
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0097",
    # proc-macro-error2 unmaintained — transitive build-time proc-macro via
    # lnk -> getset (Windows .lnk parsing). No runtime impact; no replacement yet.
    "RUSTSEC-2026-0173",
    # GTK3 bindings (and proc-macro-error via gtk3-macros) unmaintained —
    # phantom path: tray-icon/tao are macOS-only deps of monk, and their GTK
    # branch is Linux-only, so this code is never built on any shipped
    # target. cargo-deny still reports it because edge cfgs are matched
    # against the whole `targets` list (darwin admits monk -> tray-icon,
    # linux admits tray-icon -> libappindicator -> gtk). Drop these when
    # tray-icon moves off GTK3 or grows a Linux backend we actually use.
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
]
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
